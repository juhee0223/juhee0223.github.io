<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Conquer Health response and verification flow</title>
  <desc id="desc">Conversation history is optionally augmented by official-data retrieval, passed to L2 direct generation, then verified and conditionally repaired before returning a response.</desc>
  <style>
    .box { fill:#fff; stroke:#cfd7e3; stroke-width:2; rx:14; }
    .optional { fill:#f4f8fe; stroke:#006ecd; stroke-width:2; rx:14; }
    .out { fill:#006ecd; stroke:#006ecd; stroke-width:2; rx:14; }
    .t { font: 600 22px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; fill:#1f2937; text-anchor:middle; }
    .s { font: 400 16px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; fill:#5f6b7a; text-anchor:middle; }
    .white { fill:#fff; }
    .line { stroke:#8492a6; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8492a6"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfcfe"/>
  <text x="60" y="54" style="font:700 25px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#1f2937">응답·검증 흐름</text>
  <text x="60" y="82" style="font:400 16px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;fill:#5f6b7a">공식 데이터 조회 · 응답 생성 · 출력 검증</text>
  <rect class="box" x="50" y="150" width="190" height="120"/>
  <text class="t" x="145" y="197">대화 이력</text><text class="s" x="145" y="228">사용자 질문·멀티턴 문맥</text>
  <path class="line" d="M240 210 H292"/>
  <rect class="optional" x="300" y="150" width="210" height="120"/>
  <text class="t" x="405" y="193">선택적 공식 데이터</text><text class="s" x="405" y="223">약가·허가·적응증 등 MCP 조회</text><text class="s" x="405" y="246">명확한 질의에만 적용</text>
  <path class="line" d="M510 210 H562"/>
  <rect class="box" x="570" y="150" width="190" height="120"/>
  <text class="t" x="665" y="197">L2 직접 생성</text><text class="s" x="665" y="228">응답 지시·멀티턴 문맥</text>
  <path class="line" d="M760 210 H812"/>
  <rect class="box" x="820" y="150" width="190" height="120"/>
  <text class="t" x="915" y="193">출력 검증</text><text class="s" x="915" y="223">결함 탐지 · 필요 시 수정</text><text class="s" x="915" y="246">실패 시 직접 답변 폴백</text>
  <path class="line" d="M1010 210 H1062"/>
  <rect class="out" x="1070" y="150" width="90" height="120"/>
  <text class="t white" x="1115" y="201">응답</text>
  <text x="405" y="323" class="s" style="fill:#006ecd">선택 조회 실패·대상 불명확 시 직접 생성 경로로 복귀</text>
</svg>
